name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PowerShell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.9
          terraform_wrapper: false

      - name: Install test tools
        run: |
          Install-PSResource -Name Pester -Version 5.7.1 -Scope CurrentUser -TrustRepository -AcceptLicense
          Install-PSResource -Name PSScriptAnalyzer -Version 1.25.0 -Scope CurrentUser -TrustRepository -AcceptLicense
          Install-PSResource -Name powershell-yaml -Version 0.4.12 -Scope CurrentUser -TrustRepository -AcceptLicense

      - name: Parse and analyze PowerShell
        run: |
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force
          $files = @(Get-Item ./Start-ALZDelivery.ps1) + @(Get-ChildItem ./modules,./scripts,./tests,./data -Recurse -File -Include *.ps1,*.psm1)
          $problems = @()
          foreach ($file in $files) {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
              $problems += @($parseErrors)
              $problems += @(Invoke-ScriptAnalyzer -Path $file.FullName -Severity Error)
          }
          if ($problems.Count -gt 0) {
              $problems | Format-List
              throw 'PowerShell validation failed.'
          }

      - name: Run offline unit tests
        run: |
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = './tests'
          $configuration.Run.PassThru = $true
          $configuration.Output.Verbosity = 'Detailed'
          $result = Invoke-Pester -Configuration $configuration
          if ($result.Result -ne 'Passed') { throw 'Unit tests failed.' }
          exit 0

      - name: Validate accelerator schema conformance
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'bootstrap-schema.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'bootstrap-schema'
          Invoke-WebRequest -Uri 'https://github.com/Azure/accelerator-bootstrap-modules/releases/download/v7.2.1/bootstrap_modules.zip' -OutFile $archive -ConnectionTimeoutSeconds 60 -OperationTimeoutSeconds 60
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          & ./tests/Test-ALZConfigConformance.ps1 -ModulesRoot (Join-Path $destination 'alz') -RequireSchema
          if ($LASTEXITCODE -ne 0) { throw 'Schema conformance failed.' }